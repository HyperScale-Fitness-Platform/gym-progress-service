version: "3.9"

services:
  mongo:
    image: mongo:7.0
    restart: unless-stopped
    ports:
      - "27018:27017"
    volumes:
      - mongo_data:/data/db

  app:
    build: .
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - MONGO_URI=mongodb://mongo:27017/gym-progress
      - OPERATIONS_SERVICE_URL=http://localhost:4001
    depends_on:
      - mongo
    volumes:
      - ./:/app
      - /app/node_modules

volumes:
  mongo_data:
