apiVersion: apps/v1
kind: Deployment
metadata:
  name: gym-progress-service
spec:
  replicas: 3
  selector:
    matchLabels:
      app: gym-progress-service
  template:
    metadata:
      labels:
        app: gym-progress-service
    spec:
      initContainers:
        - name: wait-for-mongo
          image: busybox:1.35.0
          imagePullPolicy: IfNotPresent
          command:
            [
              "sh",
              "-c",
              "until nc -z mongo 27017; do echo waiting for mongo; sleep 2; done;",
            ]
      containers:
        - name: gym-progress-service
          image: your-registry/gym-progress-service:latest
          ports:
            - containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            - name: MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: mongo-secret
                  key: MONGO_URI
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
